# PostgreSQL local para desarrollo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bodega
      POSTGRES_PASSWORD: bodega
      POSTGRES_DB: bodega
    ports:
      - "5434:5432"  # 5434 en el host para no chocar con otros PostgreSQL locales
    volumes:
      - datos_bodega:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodega"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_bodega:
